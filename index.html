<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nyx.loader</title>
    <script>
      (function() {
        var launched = false;
        function showFallback(errText) {
          if (launched) return;
          var root = document.getElementById("root");
          if (!root) return;
          if (document.querySelector(".workspace") || document.querySelector(".recovery-screen")) return;
          launched = true;
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0A0F;color:#E8E6F0;font-family:sans-serif;padding:24px;box-sizing:border-box;">' +
            '<div style="max-width:500px;width:100%;background:#14141E;border:1px solid #2A2A3D;border-radius:20px;padding:32px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.8);">' +
            '<div style="font-size:44px;margin-bottom:12px;">⚡</div>' +
            '<h2 style="margin:0 0 12px;font-size:22px;color:#fff;font-weight:700;">Сбой запуска nyx.loader</h2>' +
            '<p style="color:#8A88A4;font-size:14px;line-height:1.6;margin-bottom:24px;">Интерфейс не смог запуститься в обычном режиме. Рекомендуется запустить утилиту в облегченном <b>Simple Mode</b> (для слабых ПК).</p>' +
            '<button onclick="try{localStorage.setItem(\'nyx_pref_simpleMode\',\'true\');}catch(e){}location.reload();" style="width:100%;padding:14px 20px;background:linear-gradient(135deg,#7B61FF,#6366F1);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(123,97,255,0.4);">' +
            '⚡ Запустить в Simple Mode (для слабых ПК)' +
            '</button>' +
            '</div></div>';
        }

        window.addEventListener("error", function(e) {
          showFallback(e.message || "Uncaught script error");
        });
        window.addEventListener("unhandledrejection", function(e) {
          showFallback(e.reason && (e.reason.message || String(e.reason)));
        });
        setTimeout(function() {
          showFallback("Таймаут инициализации приложения (медленный запуск)");
        }, 5000);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
